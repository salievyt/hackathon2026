{% extends "admin/change_list.html" %}
{% block content %}
<div class="col-12 mb-2">
  <div class="row">
    <div class="col-md-4"><div class="info-box"><span class="info-box-icon bg-primary"><i class="fas fa-users"></i></span><div class="info-box-content"><span>Всего заявок</span><strong class="h4 mb-0">{{ summary.total }}</strong></div></div></div>
    <div class="col-md-4"><div class="info-box"><span class="info-box-icon bg-success"><i class="fas fa-calendar-day"></i></span><div class="info-box-content"><span>Сегодня по Бишкеку</span><strong class="h4 mb-0">{{ summary.today }}</strong></div></div></div>
    <div class="col-md-4"><div class="info-box"><span class="info-box-icon bg-info"><i class="fas fa-paper-plane"></i></span><div class="info-box-content"><span>С контактом в Telegram</span><strong class="h4 mb-0">{{ summary.reachable }}</strong></div></div></div>
  </div>
</div>
{{ block.super }}
{% endblock %}
